<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>珞研刷题</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
  @media (max-width:560px){
      header h1{font-size:15px}
    .ch .btn{font-size:12px;padding:5px 8px;white-space:nowrap}
    .stat b{font-size:18px}
    .modes button{font-size:13px;padding:10px 4px}
    .card{padding:12px}
  }
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id":"yc117","name":"奕诚-工程力学","chapters":[{"k":"工程力学||第1章","n":"工程力学 / 第1章","qs":[{"id":"66201","t":1,"q":"力的三要素是（     ）。","a":["大小、方向、作用点","大小、方向、作用线","大小、作用点、作用线","方向、作用点、作用线","",""],"r":"A","e":"力对物体的作用效应取决于力的大小、方向和作用点，故称为力的三要素。三要素中任一要素改变，力的作用效应也随之改变，因此力是矢量。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66202","t":1,"q":"作用力与反作用力的正确说法是（     ）。","a":["大小相等、方向相反、沿同一直线，作用在同一物体上","大小相等、方向相反、沿同一直线，分别作用在两个物体上","大小不等、方向相反、沿同一直线，分别作用在两个物体上","大小相等、方向相同、沿同一直线，分别作用在两个物体上","",""],"r":"B","e":"作用力与反作用力总是成对出现，大小相等、方向相反、沿同一直线，但分别作用在两个相互作用的物体上，因此二者不能相互平衡。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66203","t":1,"q":"刚体上作用两个力使刚体保持平衡的必要与充分条件是（     ）。","a":["两力大小相等","两力方向相反","两力大小相等、方向相反","两力大小相等、方向相反、沿同一直线","",""],"r":"D","e":"二力平衡公理指出：作用在刚体上的两个力，使刚体保持平衡的必要与充分条件是这两个力大小相等、方向相反，且沿同一直线。缺“共线”条件不能平衡。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66204","t":1,"q":"在外力作用下形状和大小都不发生变化的物体称为（     ）。","a":["弹性体","刚体","塑性体","变形体","",""],"r":"B","e":"刚体是实际物体经抽象化得到的理想力学模型，指在外力作用下形状和大小都不发生变化的物体。实际物体均为变形体，刚体模型在静力学中可简化计算。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66205","t":1,"q":"变形体在外力撤除后能完全消失的变形称为（     ）。","a":["塑性变形","残余变形","弹性变形","永久变形","",""],"r":"C","e":"变形体的变形分为两类：外力撤除后随之消失的变形称为弹性变形；不能全部消失而残留的变形称为塑性变形（残余变形）。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66206","t":1,"q":"约束反力的作用方向总是（     ）。","a":["与主动力方向相同","沿约束物体的轴线方向","与约束所能限制的运动方向相反","由受力分析者任意假定","",""],"r":"C","e":"约束反力是约束对被约束物体的作用力，其方向总是与该约束所能限制的运动方向相反。这是判断约束反力方向的基本依据。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66207","t":1,"q":"柔性体（柔索）约束的约束反力，其作用线沿柔索中心线，指向（     ）。","a":["标示时可任意假设","标示时有的情况可任意假设","必定背离被约束物体","必定指向被约束物体","",""],"r":"C","e":"柔索只能承受拉力而不能承受压力，故柔索对被约束物体的约束反力必定沿柔索中心线并背离被约束物体，不能任意假设。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66208","t":1,"q":"光滑面约束的约束反力，其指向是（     ）。","a":["标示时可以先任意假设","标示时有的情况可任意假设","必定背离被约束物体","必定指向被约束物体","",""],"r":"D","e":"光滑接触面的约束反力沿接触点的公法线方向，且只能是压力，故必定指向被约束物体。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66209","t":1,"q":"固定铰支座的约束反力一般有（     ）个。","a":["一","二","三","四","",""],"r":"B","e":"固定铰支座限制物体沿任何方向的移动，但不限制转动，故在平面内提供两个相互垂直的约束反力（通常用水平和竖直分量表示）。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66210","t":1,"q":"可动铰（辊轴）支座的约束反力有（     ）个。","a":["一","二","三","四","",""],"r":"A","e":"可动铰支座只限制物体沿垂直于支承面方向的移动，不限制沿支承面的移动和转动，故只有一个垂直于支承面的约束反力。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66211","t":1,"q":"平面内固定端约束的约束反力一般有（     ）个。","a":["一","二","三","四","",""],"r":"C","e":"固定端约束既限制物体沿任何方向的移动，又限制其转动，在平面内提供两个约束反力和一个约束力偶，共三个约束量。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66212","t":1,"q":"作用在刚体上的力沿其作用线移动时（     ）。","a":["改变力对物体的移动效应","改变力对物体的转动效应","不改变其对刚体的作用效应","同时改变移动效应和转动效应","",""],"r":"C","e":"力的可传性原理：作用在刚体上的力可以沿其作用线移动而不改变其对刚体的作用效应。注意该原理只适用于刚体，不适用于变形体。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66213","t":1,"q":"力的作用线通过矩心时，该力对矩心之矩为（     ）。","a":[" 最大值","最小值但不为零","零","不能确定","",""],"r":"C","e":"力对点之矩的大小等于力与力臂的乘积。当力的作用线通过矩心时，力臂为零，故力矩为零。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66214","t":1,"q":"会引起力矩改变的情况是（     ）。","a":["力的作用点沿作用线移动","矩心沿力作用线移动","矩心平行于力作用线移动","矩心垂直于力作用线移动","",""],"r":"D","e":"力矩 M=Fd，d 为矩心到力作用线的垂直距离。矩心沿力作用线移动或平行移动时 d 不变，力矩不变；矩心垂直于力作用线移动时 d 改变，力矩随之改变。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66215","t":1,"q":"力偶矩的大小取决于（     ）。","a":["力偶合力与力偶臂","力偶中任一力和力偶臂","力偶中任一力与矩心位置","力偶在其平面内的位置及方向","",""],"r":"B","e":"力偶矩 M=Fd，其中 F 为力偶中任一力的大小，d 为力偶臂。力偶矩与矩心位置无关，只由力和力偶臂决定。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66216","t":1,"q":"力偶对物体的作用效应，决定于（     ）。","a":["力偶矩的大小","力偶的转向","力偶的作用面","力偶矩的大小、力偶的转向和力偶的作用面","",""],"r":"D","e":"力偶对刚体的作用效应由力偶矩的大小、转向和作用面方位三者共同决定，三者统称为力偶矩的三要素。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66217","t":1,"q":"下列关于力偶的说法中，错误的是（     ）。","a":["力偶对其作用面内任一点之矩恒等于力偶矩","力偶在任一坐标轴上的投影为零","力偶可以用一个力来平衡","力偶无合力，即不能用一个力等效替代","",""],"r":"C","e":"力偶是力学中的基本物理量，无合力、在任何轴上投影为零，不能用一个力来平衡，只能用力偶来平衡。故C说法错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66218","t":1,"q":"平衡是指物体相对地球处于（     ）的状态。","a":["静止","匀速运动","加速运动","静止或匀速直线运动","",""],"r":"D","e":"在一般工程问题中，地球可近似取为惯性参考系。物体相对地球保持静止或匀速直线运动，均称为处于平衡状态。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66219","t":1,"q":"物体受平面内三个互不平行的力作用而平衡，则三个力的作用线（     ）。","a":["必交于一点","必交于二点","必交于三点","交于一点、二点、三点都可能","",""],"r":"A","e":"三力平衡汇交定理：刚体在三个互不平行的力作用下平衡时，这三个力的作用线必汇交于一点。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66220","t":1,"q":"合力与分力之间的关系，正确的说法是（     ）。","a":["合力一定比分力大","两个分力夹角越小合力越小","合力不一定比分力大","两个分力夹角（锐角）越大合力越大","",""],"r":"C","e":"合力是各分力的矢量和，其大小由平行四边形法则确定。当分力夹角较大时，合力可能小于分力，故合力不一定比分力大。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66221","t":1,"q":"设力 F 与 x 轴正向夹角为锐角，则力 F 在 x 轴上的投影（     ）。","a":["为正值","为负值","为零","不能确定正负","",""],"r":"A","e":"力在轴上的投影为代数量，Fx=Fcosα。当 α 为锐角时 cosα>0，故投影为正值；α 为钝角时投影为负值；α=90° 时投影为零。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66222","t":1,"q":"力偶在任一坐标轴上的投影（     ）。","a":["等于力偶矩","等于力偶中一力的投影","为零","不能确定","",""],"r":"C","e":"力偶中两个力大小相等、方向相反，它们在同一轴上的投影之和恒为零，故力偶在任一轴上的投影均为零，写投影平衡方程时不出现力偶项。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66223","t":1,"q":"只在两个力作用下保持平衡的构件称为（     ）。","a":["二力构件","三力构件","多力构件","受弯构件","",""],"r":"A","e":"只在两个力作用下保持平衡的构件称为二力构件（二力杆）。二力构件不一定是直杆，其两力必沿两作用点的连线，且等值、反向。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66224","t":1,"q":"作用力与反作用力和一对平衡力的本质区别在于（     ）。","a":["前者大小相等，后者大小不等","前者作用在两个物体上，后者作用在同一物体上","前者方向相反，后者方向相同","前者共线，后者不共线","",""],"r":"B","e":"作用力与反作用力分别作用在两个相互作用的物体上，是同性质的力；一对平衡力则作用在同一物体上，二者合力为零。这是本质区别。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66225","t":1,"q":"使物体运动或有运动趋势的力称为（     ）。","a":["约束力","主动力","反作用力","内力","",""],"r":"B","e":"物体受到的力分为两类：使物体运动或有运动趋势的力称为主动力（如重力、荷载）；周围物体限制物体运动的力称为约束力。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66226","t":1,"q":"两个力在同一坐标系上的投影完全相等，则这两个力（     ）。","a":["一定相等","一定不相等","不一定相等","必定平衡","",""],"r":"C","e":"力的投影只反映力在某方向的分效应。两力在同一坐标系投影完全相等，只能说明它们沿两轴的分量相同；若作用点不同或空间方位不同，两力仍可能不相等。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66227","t":1,"q":"关于力对点之矩的说法，错误的是（     ）。","a":["力对点之矩与力的大小和方向有关，而与矩心位置无关","力对点之矩不会因力矢沿其作用线移动而改变","力的数值为零，或力的作用线通过矩心时，力矩为零","互相平衡的两个力对同一点之矩的代数和等于零","",""],"r":"A","e":"力对点之矩 M₀(F)=±Fd，既与力的大小、方向有关，也与矩心位置（力臂 d）有关。故A说法错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66228","t":1,"q":"画物体受力图时，下列做法正确的是（     ）。","a":["画出研究对象所受的全部内力","画出研究对象所受的主动力和约束力","画出研究对象对其他物体的作用力","把作用力与反作用力画在同一个研究对象上","",""],"r":"B","e":"受力图只画研究对象所受的外力，包括主动力和约束力，不画内力。作用力与反作用力应分别画在各自的受力图上。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66229","t":1,"q":"光滑圆柱铰链约束的约束反力（     ）。","a":["只有一个","有两个互相垂直的分量","有一个力偶","有三个分量","",""],"r":"B","e":"光滑圆柱铰链限制两构件沿径向的相对移动，但不限制相对转动，在平面内可用两个互相垂直的分量表示其约束反力。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66230","t":1,"q":"若一个力和一个力系等效，则该力称为此力系的（     ）。","a":["平衡力","合力","分力","主动力","",""],"r":"B","e":"等效力系指对物体作用效果相同的力系。若一个力与某力系等效，则该力即为该力系的合力，力系中各力称为该合力的分力。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66246","t":2,"q":"下列关于力的说法中，正确的有（     ）。","a":["力的三要素是大小、方向、作用点","力是矢量","力的可传性原理适用于任何物体","合力不一定比分力大","",""],"r":"ABD","e":"力的三要素是大小、方向、作用点，力是矢量；合力由平行四边形法则确定，不一定比分力大。力的可传性原理只适用于刚体，不适用于变形体，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66247","t":2,"q":"下列约束类型与其约束反力对应正确的有（     ）。","a":["柔性约束：沿柔索中心线，背离被约束物体","光滑面约束：沿公法线，指向被约束物体","固定铰支座：平面内有两个约束反力分量","可动铰支座：有两个约束反力分量","",""],"r":"ABC","e":"柔性约束只能受拉，反力背离被约束物体；光滑面约束反力沿公法线并指向被约束物体；固定铰支座在平面内有两个反力分量；可动铰支座只有一个垂直于支承面的反力，故D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66248","t":2,"q":"下列关于力矩的说法中，正确的有（     ）。","a":["力对点之矩与矩心位置有关","力沿作用线移动，力对点之矩不变","力的作用线通过矩心时力矩为零","力矩的大小与矩心位置无关","",""],"r":"ABC","e":"力矩 M₀(F)=Fd，d 为矩心到力作用线的垂直距离，故与矩心位置有关；力沿作用线移动时 d 不变，力矩不变；作用线过矩心时 d=0，力矩为零。故D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66249","t":2,"q":"下列关于力偶的说法中，正确的有（     ）。","a":["力偶对其作用面内任一点之矩等于力偶矩","力偶在任一轴上的投影均为零","力偶无合力，不能用一个力来平衡","力偶对物体既产生转动效应又产生移动效应","",""],"r":"ABC","e":"力偶的基本性质：对作用面内任一点之矩恒等于力偶矩；在任一轴上投影为零；无合力，只能用力偶平衡。力偶只产生转动效应，不产生移动效应，故D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66250","t":2,"q":"下列情形中，物体处于平衡状态的有（     ）。","a":["物体受大小相等、方向相反且沿同一直线的两个力作用","物体受汇交于一点且力三角形封闭的三个力作用","物体受两个力偶矩大小相等、转向相反的力偶作用","物体在作用力与反作用力作用下","",""],"r":"ABC","e":"二力平衡、三力汇交且力三角形封闭、两力偶等值反向均可使刚体平衡。作用力与反作用力作用在两个物体上，不能使同一物体平衡，故D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66251","t":2,"q":"下列关于变形的说法中，正确的有（     ）。","a":["外力撤除后消失的变形称为弹性变形","外力撤除后残留的变形称为塑性变形","工程材料均可视为理想刚体","弹性变形与塑性变形可同时存在于同一构件中","",""],"r":"ABD","e":"弹性变形随外力撤除而消失，塑性变形则残留下来；弹塑性阶段二者并存。实际工程材料均为变形体，只有在可忽略变形时才抽象为刚体，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66252","t":2,"q":"关于二力平衡公理与作用反作用公理，下列说法正确的有（     ）。","a":["二力平衡的两个力作用在同一物体上","作用力与反作用力分别作用在两个物体上","二力平衡的两个力是同性质的力","作用力与反作用力大小相等、方向相反、沿同一直线","",""],"r":"ABD","e":"二力平衡的两个力作用在同一刚体上；作用力与反作用力分别作用在两个相互作用的物体上。二力平衡的两个力性质可以不同，作用力与反作用力必定是同性质的力，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66253","t":2,"q":"画受力图时应当注意的有（     ）。","a":["只画研究对象所受的外力，不画内力","约束反力应按约束类型确定方向","作用力与反作用力应分别画在各自的受力图上","可先假定约束反力方向，与计算结果对照判断正负","",""],"r":"ABCD","e":"受力图是静力学分析的基础：只画外力、按约束类型定反力、作用反作用分画在两个研究对象上、未知方向可先假定再由结果符号判断。四选项均正确。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66254","t":2,"q":"下列关于力的可传性的说法中，正确的有（     ）。","a":["力可沿其作用线移动而不改变对刚体的作用效应","力的可传性原理只适用于刚体","力沿作用线移动时，力对任一点之矩不变","力沿作用线移动时，力在任一轴上的投影改变","",""],"r":"ABC","e":"力的可传性只适用于刚体；沿作用线移动时力臂与投影角均不变，故力矩和投影都不变，D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66255","t":2,"q":"下列关于合力的说法中，正确的有（     ）。","a":["合力在任一轴上的投影等于各分力在同一轴上投影的代数和","合力对平面上任一点的矩等于各分力对同一点的矩的代数和","合力一定大于任一分力","两个分力夹角越大，合力越小","",""],"r":"ABD","e":"合力投影定理与合力矩定理是静力学基本定理。两个分力夹角越大合力越小；夹角足够大时合力可能小于分力，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66256","t":2,"q":"关于力在轴上的投影，下列说法正确的有（     ）。","a":["投影是代数量","力垂直于某轴时，力在该轴上投影为零","力平行于某轴时，力在该轴上投影为零","投影的绝对值不超过力的大小","",""],"r":"ABD","e":"力在轴上的投影为代数量 Fcosα，其绝对值不大于力的大小；力垂直于轴时投影为零，平行于轴时投影绝对值等于力的大小，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66257","t":2,"q":"下列物体中，可视为刚体模型的有（     ）。","a":["研究起重机整体平衡时的吊臂","研究桥梁支座反力时的桥跨结构","研究螺栓剪切面应力时的螺栓","研究齿轮传动比时的齿轮","",""],"r":"ABD","e":"当物体变形对所研究问题影响很小、可忽略时，可抽象为刚体。研究螺栓剪切面应力属于强度问题，必须考虑变形，不能视为刚体，故C错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66258","t":2,"q":"工程中常见的支座形式有（     ）。","a":["固定铰支座","可动铰（辊轴）支座","固定端支座","柔性约束","",""],"r":"ABC","e":"结构力学与工程中常见的支座有固定铰支座、可动铰（辊轴）支座和固定端支座。柔性约束属于约束类型，但不是支座形式，故D不选。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66259","t":2,"q":"关于力偶矩，下列说法正确的有（     ）。","a":["力偶矩等于力偶中任一力与力偶臂的乘积","力偶矩与矩心位置无关","力偶矩的单位与力矩的单位相同","力偶矩是矢量，其方向沿力偶臂","",""],"r":"ABC","e":"M=Fd，F 为力偶中任一力，d 为力偶臂；力偶矩与矩心无关，单位同为 N·m。在平面问题中力偶矩可视为代数量，不沿力偶臂方向，故D错误。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66260","t":2,"q":"下列属于静力学公理的有（     ）。","a":["二力平衡公理","加减平衡力系公理","作用与反作用公理","胡克定律","",""],"r":"ABC","e":"静力学公理包括二力平衡公理、加减平衡力系公理、作用与反作用公理（力的平行四边形法则亦属公理体系）。胡克定律是材料力学中的物理方程，不是静力学公理，故D不选。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66231","t":3,"q":"合力不一定比分力大。（     ）","a":["正确","错误","","","",""],"r":"A","e":"合力是各分力的矢量和。当两分力夹角较大时，合力可能小于其中的分力，故合力不一定比分力大。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66232","t":3,"q":"两个力在同一坐标系上的投影完全相等，则这两个力一定相等。（     ）","a":["正确","错误","","","",""],"r":"B","e":"投影只反映力沿坐标轴的分效应。两力投影相同只说明分量相同，若作用点或空间方位不同，两力仍可能不相等。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66233","t":3,"q":"约束是限制物体自由度的装置。（     ）","a":["正确","错误","","","",""],"r":"A","e":"约束是限制物体某些方向运动（即限制自由度）的周围物体或装置，如柔索、光滑面、铰支座等。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66234","t":3,"q":"约束反力的方向一定与被约束体所限制的运动方向相反。（     ）","a":["正确","错误","","","",""],"r":"A","e":"约束反力是约束对被约束物体的作用，其方向总是与该约束所能限制的运动方向相反，这是确定约束反力方向的基本原则。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66235","t":3,"q":"力沿其作用线移动时，力在坐标轴上的投影不变。（     ）","a":["正确","错误","","","",""],"r":"A","e":"力沿作用线移动不改变力的大小和方向，故与坐标轴的夹角不变，投影也不变。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66236","t":3,"q":"力偶在坐标轴上有投影。（     ）","a":["正确","错误","","","",""],"r":"B","e":"力偶由两个等值、反向、不共线的力组成，它们在同一轴上的投影之和恒为零，故力偶在任一坐标轴上的投影均为零。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66237","t":3,"q":"力沿作用线移动，力对点之矩改变。（     ）","a":["正确","错误","","","",""],"r":"B","e":"力沿作用线移动时，矩心到力作用线的垂直距离（力臂）不变，故力对点之矩不变。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66238","t":3,"q":"力平行于某轴时，力在该轴上的投影为零。（     ）","a":["正确","错误","","","",""],"r":"B","e":"力平行于某轴时，力与该轴夹角为 0° 或 180°，投影的绝对值等于力的大小，并不为零。力垂直于轴时投影才为零。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66239","t":3,"q":"合力一定比分力大。（     ）","a":["正确","错误","","","",""],"r":"B","e":"由力的平行四边形法则可知，合力不一定比分力大。两分力夹角很大时合力可能比分力小。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66240","t":3,"q":"力的作用线通过矩心时，该力对矩心之矩为零。（     ）","a":["正确","错误","","","",""],"r":"A","e":"力对点之矩等于力与力臂的乘积，作用线通过矩心时力臂为零，故力矩为零。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66241","t":3,"q":"力偶可以用一个合力来平衡。（     ）","a":["正确","错误","","","",""],"r":"B","e":"力偶无合力，在任何轴上投影为零，只能用力偶来平衡，不能用一个力来平衡。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66242","t":3,"q":"作用在刚体上的力可沿其作用线移动而不改变其对刚体的运动效应。（     ）","a":["正确","错误","","","",""],"r":"A","e":"这是力的可传性原理，是加减平衡力系公理的推论，只适用于刚体。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66243","t":3,"q":"只要两个力大小相等、方向相反，这两个力就组成一个力偶。（     ）","a":["正确","错误","","","",""],"r":"B","e":"组成力偶的两个力还必须不共线（即力偶臂不为零）。若两力共线，则构成一对平衡力，而不是力偶。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66244","t":3,"q":"力矩的大小和转向与矩心位置有关，力偶矩的大小和转向与矩心位置无关。（     ）","a":["正确","错误","","","",""],"r":"A","e":"力矩依赖于矩心到力作用线的距离；力偶对其作用面内任一点之矩恒等于力偶矩，与矩心位置无关。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]},{"id":"66245","t":3,"q":"两物体间相互作用的力，总是大小相等、方向相反、沿同一直线，作用在同一物体上。（     ）","a":["正确","错误","","","",""],"r":"B","e":"作用力与反作用力分别作用在两个相互作用的物体上，而不是同一物体上。","l3":"工程力学","l4":"第1章","ap":[false,false,false,false,false,false]}]},{"k":"工程力学||第2章","n":"工程力学 / 第2章","qs":[{"id":"66261","t":1,"q":"若平面力系中各力的作用线均汇交于一点，则此力系称为（     ）。","a":["平面平行力系","平面汇交力系","平面力偶系","平面一般力系","",""],"r":"B","e":"各力作用线在同一平面内且汇交于一点的力系称为平面汇交力系；各力作用线相互平行的称为平面平行力系；仅由力偶组成的称为平面力偶系。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66262","t":1,"q":"若平面力系中各力的作用线均相互平行，则此力系称为（     ）。","a":["平面汇交力系","平面力偶系","平面平行力系","平面一般力系","",""],"r":"C","e":"各力作用线在同一平面内且相互平行的力系称为平面平行力系，它是平面一般力系的特殊情况。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66263","t":1,"q":"平面汇交力系独立平衡方程的数目为（     ）。","a":["1 个","2 个","3 个","6 个","",""],"r":"B","e":"平面汇交力系只有两个独立的平衡方程：ΣFx=0、ΣFy=0。两个投影方程即可求解两个未知量。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66264","t":1,"q":"平面平行力系独立平衡方程的数目一般有（     ）。","a":["1 个","2 个","3 个","4 个","",""],"r":"B","e":"平面平行力系各力作用线平行，只有一个方向的投影方程有意义，故独立平衡方程为两个，例如 ΣFy=0 和 ΣM₀=0。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66265","t":1,"q":"平面任意（一般）力系独立平衡方程的数目为（     ）。","a":["2 个","3 个","4 个","6 个","",""],"r":"B","e":"平面一般力系的平衡条件是主矢为零、主矩为零，对应三个独立平衡方程：ΣFx=0、ΣFy=0、ΣM₀=0。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66266","t":1,"q":"作用在刚体上的力可以平移到刚体上任意指定点，但必须在该力与指定点所决定的平面内附加一个（     ）。","a":["力","力偶","力螺旋","约束力","",""],"r":"B","e":"力的平移定理：力可平移到刚体内任一点，但须附加一个力偶，其力偶矩等于原力对该点之矩。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66267","t":1,"q":"平面一般力系向一点简化，一般可得（     ）。","a":["一个合力","一个合力偶","一个力和一个力偶","一个力螺旋","",""],"r":"C","e":"平面一般力系向平面内任一点简化，可得一个力（主矢）和一个力偶（主矩）。主矢与简化中心无关，主矩与简化中心有关。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66268","t":1,"q":"平面一般力系简化的主矢与简化中心的位置（     ）。","a":["有关","无关","可能有关","视力系而定","",""],"r":"B","e":"主矢等于力系中各力的矢量和，只由各力本身决定，与简化中心位置无关；主矩则随简化中心改变。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66269","t":1,"q":"平面一般力系简化的主矩与简化中心的位置（     ）。","a":["有关","无关","一定无关","恒为零","",""],"r":"A","e":"主矩等于各力对简化中心之矩的代数和，简化中心改变时各力的力臂随之改变，故主矩与简化中心位置有关。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66270","t":1,"q":"若平面一般力系向某点简化得到一合力偶，则另选适当简化中心，能否将力系简化为一个合力（     ）。","a":["能","不能","不一定","视主矩大小而定","",""],"r":"B","e":"若简化结果为合力偶，说明主矢为零而主矩不为零。主矢为零与简化中心无关，故无论选何简化中心都不可能得到合力。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66271","t":1,"q":"平面力系平衡的必要与充分条件是（     ）。","a":["主矢等于零","主矩等于零","主矢等于零且对任意点的主矩等于零","主矢在 x 轴投影为零","",""],"r":"C","e":"平面力系平衡的充要条件是力系的主矢等于零，且对任意点的主矩等于零，二者缺一不可。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66272","t":1,"q":"物体受平面内三个互不平行的力作用而平衡，则这三个力（     ）。","a":["必汇交于一点","必相互平行","必组成封闭力三角形","A和C都对","",""],"r":"D","e":"三力平衡时，若三力互不平行则必汇交于一点（三力平衡汇交定理）；从矢量角度看，三力首尾相接必组成封闭的力三角形。两种表述等价。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66273","t":1,"q":"平面汇交力系合成的结果是（     ）。","a":["一个力偶","一个合力","一个力和一个力偶","平衡","",""],"r":"B","e":"平面汇交力系各力作用线汇交于一点，其合成结果只能是一个通过汇交点的合力；合力为零时力系平衡。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66274","t":1,"q":"平面力偶系合成的结果是（     ）。","a":["一个合力","一个合力偶","一个力和一个力偶","一定平衡","",""],"r":"B","e":"平面力偶系合成后仍为一个力偶，其力偶矩等于各力偶矩的代数和；合力偶矩为零时力偶系平衡。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66275","t":1,"q":"平面任意力系合成的最终结果可能是（     ）。","a":["一个合力","一个合力偶","平衡","以上三种均可能","",""],"r":"D","e":"平面一般力系简化后：主矢不为零、主矩为零得合力；主矢为零、主矩不为零得合力偶；主矢主矩均为零则平衡。三种情况均有可能。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66276","t":1,"q":"平面一般力系有三个独立平衡方程，但有时可写出第四个方程，其条件是（     ）。","a":["所选投影轴互相垂直","所选矩心与投影轴共线","所选两投影轴不平行","投影轴不与任一力垂直","",""],"r":"C","e":"平面一般力系的二矩式平衡方程要求两矩心连线不垂直于投影轴；三矩式要求三矩心不共线。满足这些条件时，附加方程才不与原方程线性相关。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66277","t":1,"q":"当物体系统处于平衡时，组成该系统的每个物体（     ）。","a":["不一定平衡","处于平衡状态","有的平衡有的不平衡","无法判断","",""],"r":"B","e":"系统整体平衡时，其中每个物体、每个部分都处于平衡状态，这是研究物体系统平衡问题的基本出发点。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66278","t":1,"q":"研究物体系统平衡时，若未知量数目少于或等于独立平衡方程数目，这类问题称为（     ）。","a":["超静定问题","静不定问题","静定问题","几何可变问题","",""],"r":"C","e":"未知量数目少于或等于独立平衡方程数目的平衡问题称为静定问题；未知量数目超过独立平衡方程数目的称为超静定（静不定）问题。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66279","t":1,"q":"研究物体系统平衡时，若未知量数目超过独立平衡方程数目，这类问题称为（     ）。","a":["静定问题","超静定问题","几何不变问题","瞬变体系","",""],"r":"B","e":"未知量数目超过独立平衡方程数目时，仅由平衡方程不能求出全部未知量，必须补充变形协调条件，这类问题称为超静定问题。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66280","t":1,"q":"合力在任一轴上的投影等于各分力在同一轴上投影的（     ）。","a":["矢量和","代数和","乘积","几何平均","",""],"r":"B","e":"合力投影定理：合力在任一轴上的投影等于各分力在同一轴上投影的代数和。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66281","t":1,"q":"合力对平面上任一点的矩等于各分力对同一点的矩的（     ）。","a":["矢量和","代数和","乘积之和","均值","",""],"r":"B","e":"合力矩定理：合力对平面内任一点之矩等于各分力对同一点之矩的代数和。该定理常用于求合力位置或计算分布力的合力。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66282","t":1,"q":"平面力系平衡方程的二矩式为 ΣMA=0、ΣMB=0、ΣFx=0，其附加条件是（     ）。","a":["A、B两点连线不平行于 x 轴","A、B两点连线不垂直于 x 轴","A、B两点连线平行于 x 轴","任取 A、B 两点即可","",""],"r":"B","e":"二矩式要求两矩心 A、B 的连线不垂直于投影轴 x，否则两矩式方程与投影方程线性相关，独立方程数不足。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66283","t":1,"q":"空间汇交力系独立平衡方程的数目为（     ）。","a":["2 个","3 个","4 个","6 个","",""],"r":"B","e":"空间汇交力系有三个独立平衡方程：ΣFx=0、ΣFy=0、ΣFz=0，可求解三个未知量。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66284","t":1,"q":"空间一般力系独立平衡方程的数目为（     ）。","a":["3 个","4 个","5 个","6 个","",""],"r":"D","e":"空间一般力系的平衡条件是主矢为零和主矩为零，各为矢量方程，故共有六个独立平衡方程：三个投影方程和三个力矩方程。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66285","t":1,"q":"空间力偶系合成的结果是（     ）。","a":["一个合力","一个合力偶","一个力螺旋","一定平衡","",""],"r":"B","e":"空间力偶系合成后仍为一个合力偶，其力偶矩矢等于各分力偶矩矢的矢量和；合力偶矩矢为零时力偶系平衡。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66286","t":1,"q":"力对轴之矩的绝对值等于（     ）。","a":["力的大小与力到轴距离的乘积","力在轴上投影与力臂的乘积","力与轴夹角的余弦","力偶矩的大小","",""],"r":"B","e":"力对轴之矩 Mz(F)=±Fd，其中 d 为力作用线到该轴的垂直距离，也可理解为力在垂直于轴的平面上的投影对该轴交点之矩。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66287","t":1,"q":"当力与某轴平行时，力对该轴之矩（     ）。","a":["最大","最小但不为零","为零","不能确定","",""],"r":"C","e":"力平行于某轴时，力作用线到该轴的垂直距离不能确定为有限值对应的转动效应为零，即力对该轴之矩为零（力与轴共面平行）。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66288","t":1,"q":"空间力对点之矩的正确表示是（     ）。","a":["代数量","矢量，方向由右手螺旋法则确定","矢量，方向沿力的方向","标量","",""],"r":"B","e":"空间力对点之矩是矢量，其方向由右手螺旋法则确定，垂直于力与矩心所决定的平面，大小等于力臂与力的乘积。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66289","t":1,"q":"平面一般力系的平衡方程若采用三矩式 ΣMA=0、ΣMB=0、ΣMC=0，则 A、B、C 三点（     ）。","a":["可任取","必须共线","不得共线","必须在同一直线上","",""],"r":"C","e":"三矩式要求三个矩心不共线，否则三个力矩方程线性相关，独立方程数不足，不能求解全部未知量。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66290","t":1,"q":"某平面力系由同一平面内的两个力偶组成，则该力系平衡的条件是（     ）。","a":["两力偶矩大小相等、转向相同","两力偶矩大小相等、转向相反","两力偶的力大小相等","两力偶的力偶臂相等","",""],"r":"B","e":"平面力偶系平衡的充要条件是各力偶矩的代数和为零。两力偶矩大小相等、转向相反时，代数和为零，力偶系平衡。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66291","t":2,"q":"平面一般力系的平衡方程形式有（     ）。","a":["ΣFx=0、ΣFy=0、ΣM₀=0","ΣMA=0、ΣMB=0、ΣFx=0","ΣMA=0、ΣMB=0、ΣMC=0","ΣFx=0、ΣM₀=0","",""],"r":"ABC","e":"平面一般力系有三个独立平衡方程，常用一矩式、二矩式、三矩式三种形式，各有附加条件。D 只有两个方程，不足以求解一般力系。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66292","t":2,"q":"下列关于主矢与主矩的说法中，正确的有（     ）。","a":["主矢与简化中心无关","主矩与简化中心有关","主矢为零时力系必平衡","主矩为零时力系必平衡","",""],"r":"AB","e":"主矢是各力的矢量和，与简化中心无关；主矩是各力对简化中心之矩的代数和，与简化中心有关。主矢为零但主矩不为零时得合力偶，力系不平衡；主矩为零但主矢不为零时得合力，也不平衡，故C、D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66293","t":2,"q":"关于力的平移定理，下列说法正确的有（     ）。","a":["力可平移到刚体内任一点","平移时须附加一个力偶","附加力偶矩等于原力对新作用点之矩","平移后力的作用效应不变","",""],"r":"ABC","e":"力的平移定理指出：力可平移到刚体内任一点，但须附加一个力偶，其力偶矩等于原力对新作用点之矩。平移后力与附加力偶共同等效替代原力，作用效应保持等效，但并非“力本身作用效应不变”，故D表述不严谨。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66294","t":2,"q":"平面力系简化结果可能是（     ）。","a":["一个合力","一个合力偶","平衡","力螺旋","",""],"r":"ABC","e":"平面一般力系简化结果只有三种：合力、合力偶、平衡。力螺旋是空间力系简化可能出现的结果，平面力系不会出现。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66295","t":2,"q":"下列关于物体系统平衡的说法中，正确的有（     ）。","a":["系统平衡时每个物体都处于平衡状态","可取整体为研究对象，也可取局部为研究对象","整体平衡方程与局部平衡方程相互独立","求解时应先取整体后取局部，避免求解联立方程","",""],"r":"ABD","e":"系统平衡时各部分均平衡；研究对象可整体可局部，合理选择可减少联立方程。整体平衡方程与局部平衡方程并非完全独立（整体方程可由局部方程组合得到），故C错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66296","t":2,"q":"下列关于静定问题与超静定问题的说法中，正确的有（     ）。","a":["静定问题未知量数目不超过独立平衡方程数目","超静定问题未知量数目超过独立平衡方程数目","超静定问题仅由平衡方程不能求出全部未知量","静定问题与结构的几何组成无关","",""],"r":"ABC","e":"静定问题可由平衡方程求出全部未知量；超静定问题必须补充变形协调条件。静定问题与结构几何组成密切相关（几何不变且无多余约束），故D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66297","t":2,"q":"平面汇交力系的合力（     ）。","a":["通过汇交点","大小等于各力的矢量和","在 x 轴上的投影等于各分力在 x 轴上投影的代数和","一定大于任一分力","",""],"r":"ABC","e":"平面汇交力系的合力通过汇交点，是各力的矢量和，满足合力投影定理。合力不一定大于任一分力，故D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66298","t":2,"q":"下列关于合力矩定理的说法中，正确的有（     ）。","a":["合力对任一点之矩等于各分力对同一点之矩的代数和","可用于求合力作用线位置","可用于求分布力合力的作用位置","只适用于平面汇交力系","",""],"r":"ABC","e":"合力矩定理适用于任意力系，是求合力作用线位置、确定分布力合力作用点的有力工具，并非只适用于平面汇交力系。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66299","t":2,"q":"下列关于空间力系的说法中，正确的有（     ）。","a":["空间一般力系有六个独立平衡方程","空间汇交力系有三个独立平衡方程","空间力偶系平衡的充要条件是合力偶矩矢为零","空间平行力系有六个独立平衡方程","",""],"r":"ABC","e":"空间一般力系 6 个、空间汇交力系 3 个独立平衡方程；空间力偶系平衡条件为合力偶矩矢为零。空间平行力系只有 3 个独立平衡方程（两力矩一投影或三力矩），故D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66300","t":2,"q":"关于力对轴之矩，下列说法正确的有（     ）。","a":["力对轴之矩是代数量","力与轴平行时，力对该轴之矩为零","力与轴相交时，力对该轴之矩为零","力对轴之矩的单位为 N·m","",""],"r":"ABCD","e":"力对轴之矩是代数量，反映力使物体绕该轴转动的效应；力与轴平行或相交时力对该轴之矩均为零；单位与力矩相同。四选项均正确。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66301","t":2,"q":"平面平行力系平衡方程的常用形式有（     ）。","a":["ΣFy=0、ΣM₀=0","ΣMA=0、ΣMB=0","ΣFx=0、ΣFy=0、ΣM₀=0","ΣFx=0、ΣM₀=0","",""],"r":"AB","e":"平面平行力系有两个独立平衡方程，常用两投影式（沿平行方向）或两矩式。C 为平面一般力系的方程，D 中 ΣFx=0 恒成立，无独立信息。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66302","t":2,"q":"下列情形中，平面力系一定不平衡的有（     ）。","a":["各力均不为零且汇交于同一点，力多边形不封闭","主矢不为零","主矢为零而主矩不为零","主矢与主矩均为零","",""],"r":"ABC","e":"力多边形不封闭说明合力不为零；主矢不为零得合力；主矢为零、主矩不为零得合力偶，三者均不平衡。主矢与主矩均为零才是平衡的充要条件。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66303","t":2,"q":"关于力偶系的合成与平衡，下列说法正确的有（     ）。","a":["平面力偶系合成结果为一合力偶","合力偶矩等于各分力偶矩的代数和","力偶系平衡的充要条件是合力偶矩为零","力偶系合成结果可能为一个合力","",""],"r":"ABC","e":"平面力偶系合成后仍为力偶（或为零），合力偶矩为各力偶矩的代数和；合力偶矩为零时平衡。力偶系不可能合成为一个力，故D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66304","t":2,"q":"下列关于约束力与平衡方程数目的说法中，正确的有（     ）。","a":["固定铰支座在平面内提供两个未知量","可动铰支座提供一个未知量","固定端支座在平面内提供三个未知量","柔索约束提供两个未知量","",""],"r":"ABC","e":"固定铰支座 2 个、可动铰支座 1 个、固定端支座 3 个（两反力一反力偶）未知量；柔索约束只有一个沿索方向的未知拉力，故D错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66305","t":2,"q":"关于空间力对点之矩，下列说法正确的有（     ）。","a":["是矢量","方向由右手螺旋法则确定","垂直于力与矩心所决定的平面","大小等于力在垂直于矩心矢径平面上的投影与力臂的乘积，亦即 r×F 的模","",""],"r":"ABCD","e":"空间力对点之矩是矢量 M₀(F)=r×F，方向由右手螺旋法则确定，垂直于 r 与 F 所决定的平面，大小为 rFsinθ=Fd。四选项均正确。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66306","t":3,"q":"平面一般力系简化的主矩与简化中心无关。（     ）","a":["正确","错误","","","",""],"r":"B","e":"主矩等于各力对简化中心之矩的代数和，简化中心改变时力臂改变，主矩随之改变。与简化中心无关的是主矢。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66307","t":3,"q":"平面一般力系简化的主矢与简化中心无关。（     ）","a":["正确","错误","","","",""],"r":"A","e":"主矢等于力系中各力的矢量和，只取决于各力本身，与简化中心位置无关。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66308","t":3,"q":"作用在刚体上的力可沿作用线移动，对刚体的作用效应不变。（     ）","a":["正确","错误","","","",""],"r":"A","e":"这是力的可传性原理，只适用于刚体。移动后力对刚体的移动效应和转动效应均不变。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66309","t":3,"q":"力偶在任一轴上投影为零，故写投影平衡方程时不必考虑力偶。（     ）","a":["正确","错误","","","",""],"r":"A","e":"力偶在任一轴上的投影恒为零，因此投影平衡方程中不会出现力偶项；力偶只出现在力矩方程中。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66310","t":3,"q":"平面汇交力系平衡的必要与充分条件是合力等于零。（     ）","a":["正确","错误","","","",""],"r":"A","e":"平面汇交力系合成结果为一合力，合力为零时力系平衡。可用几何法（力多边形封闭）或解析法（两投影方程）求解。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66311","t":3,"q":"物体受平面内三个互不平行的力作用而平衡，三力必汇交于一点。（     ）","a":["正确","错误","","","",""],"r":"A","e":"三力平衡汇交定理：刚体受三个互不平行的力作用而平衡时，三力的作用线必汇交于一点。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66312","t":3,"q":"平面任意力系向一点简化，主矢的大小和方向与简化中心无关，主矩与简化中心有关。（     ）","a":["正确","错误","","","",""],"r":"A","e":"主矢是各力的矢量和，与简化中心无关；主矩是各力对简化中心之矩的代数和，随简化中心而变。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66313","t":3,"q":"若平面力系向某点简化得到合力偶，则可通过另选简化中心得到合力。（     ）","a":["正确","错误","","","",""],"r":"B","e":"简化结果为合力偶说明主矢为零、主矩不为零。主矢为零与简化中心无关，故无论怎样选简化中心都不能得到合力。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66314","t":3,"q":"合力矩定理只适用于平面汇交力系。（     ）","a":["正确","错误","","","",""],"r":"B","e":"合力矩定理适用于任意力系：合力对任一点之矩等于各分力对同一点之矩的代数和。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66315","t":3,"q":"平面力系平衡方程的三矩式要求三个矩心不得共线。（     ）","a":["正确","错误","","","",""],"r":"A","e":"三矩心共线时三个力矩方程线性相关，独立方程数不足，故要求三个矩心不共线。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66316","t":3,"q":"当物体系统处于平衡时，组成该系统的每个物体都处于平衡状态。（     ）","a":["正确","错误","","","",""],"r":"A","e":"整体平衡则局部必平衡，这是取隔离体研究物体系统平衡问题的基本依据。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66317","t":3,"q":"未知量数目超过独立平衡方程数目的平衡问题称为静定问题。（     ）","a":["正确","错误","","","",""],"r":"B","e":"未知量数目超过独立平衡方程数目的问题称为超静定（静不定）问题；少于或等于的才称为静定问题。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66318","t":3,"q":"空间一般力系有六个独立平衡方程，可求解六个未知量。（     ）","a":["正确","错误","","","",""],"r":"A","e":"空间一般力系的主矢和主矩各为矢量方程，共六个标量方程，可求解六个未知量。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66319","t":3,"q":"平面力偶系平衡的充要条件是各力偶矩的代数和为零。（     ）","a":["正确","错误","","","",""],"r":"A","e":"平面力偶系合成结果为一合力偶，其矩为各力偶矩的代数和；代数和为零则力偶系平衡。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]},{"id":"66320","t":3,"q":"力对轴之矩等于零时，力与该轴必定相交。（     ）","a":["正确","错误","","","",""],"r":"B","e":"力对轴之矩为零有两种情形：力与轴平行，或力与轴相交（含共面）。题干说法不全面，故错误。","l3":"工程力学","l4":"第2章","ap":[false,false,false,false,false,false]}]},{"k":"工程力学||第3章","n":"工程力学 / 第3章","qs":[{"id":"66321","t":1,"q":"点作曲线运动时，速度的大小等于（     ）。","a":["矢径对时间的一阶导数","弧坐标对时间的一阶导数的绝对值","直角坐标对时间的一阶导数","加速度对时间的积分","",""],"r":"B","e":"速度是矢量，其大小等于路程（弧坐标）对时间的一阶导数的绝对值，方向沿轨迹的切线并指向运动的一方。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66322","t":1,"q":"点作曲线运动时，加速度可以分解为（     ）。","a":["切向加速度和法向加速度","绝对加速度和相对加速度","牵连加速度和科氏加速度","向心加速度和离心加速度","",""],"r":"A","e":"在自然坐标系中，点的加速度分解为切向加速度 aτ=dv/dt（反映速度大小的变化）和法向加速度 an=v²/ρ（反映速度方向的变化）。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66323","t":1,"q":"点作匀速圆周运动时，其加速度（     ）。","a":["为零","只有切向分量","只有法向分量","切向、法向分量均不为零","",""],"r":"C","e":"匀速圆周运动速度大小不变，故切向加速度为零；速度方向不断改变，故法向加速度 an=v²/R≠0，方向指向圆心。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66324","t":1,"q":"点作曲线运动时，法向加速度的方向（     ）。","a":["沿轨迹切线","沿主法线并指向曲率中心","沿主法线背离曲率中心","沿副法线","",""],"r":"B","e":"法向加速度 an=v²/ρ 沿主法线并指向曲率中心（即指向轨迹内侧），只反映速度方向的变化率。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66325","t":1,"q":"某点的运动方程为 x=3t²（SI），则该点在 t=2 s 时的速度为（     ）。","a":["3 m/s","6 m/s","12 m/s","24 m/s","",""],"r":"C","e":"速度 v=dx/dt=6t，代入 t=2 s 得 v=12 m/s。注意运动方程对时间求一阶导数得速度，求二阶导数得加速度。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66326","t":1,"q":"刚体平动时，其上各点的轨迹（     ）。","a":["一定是直线","一定是圆","形状相同且互相平行","互不相同","",""],"r":"C","e":"刚体平动时其上任一直线始终与原位置平行，故各点轨迹形状相同且互相平行，任一时刻各点速度、加速度均相同。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66327","t":1,"q":"刚体平动时，其上任意两点的（     ）。","a":["速度相同、加速度不同","速度不同、加速度相同","速度和加速度均相同","速度和加速度均不同","",""],"r":"C","e":"平动刚体上各点在同一瞬时的速度和加速度完全相同，因此研究平动刚体可归结为研究其上任一点的运动。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66328","t":1,"q":"刚体绕定轴转动时，角速度是（     ）。","a":["代数量","矢量，方向沿转轴","矢量，方向沿半径","标量","",""],"r":"B","e":"角速度是矢量，方向沿转轴并由右手螺旋法则确定（四指随转向弯曲，拇指指向为角速度方向）。在平面问题中常按代数量处理。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66329","t":1,"q":"刚体定轴转动时，转角 φ 对时间的一阶导数表示（     ）。","a":["角加速度","角速度","角位移","线速度","",""],"r":"B","e":"角速度 ω=dφ/dt，角加速度 α=dω/dt=d²φ/dt²。角速度描述转动快慢，角加速度描述角速度的变化率。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66330","t":1,"q":"定轴转动刚体上距转轴 r 处一点的速度大小为（     ）。","a":["v=αr","v=ωr","v=ω²r","v=ω/r","",""],"r":"B","e":"定轴转动刚体上点的速度大小 v=ωr，方向沿圆周切线并指向转动的一方，与角速度满足右手关系。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66331","t":1,"q":"定轴转动刚体上距转轴 r 处一点的切向加速度大小为（     ）。","a":["aτ=αr","aτ=ωr","aτ=ω²r","aτ=α/r","",""],"r":"A","e":"切向加速度 aτ=αr，反映速度大小的变化；法向加速度 an=ω²r=v²/r，反映速度方向的变化。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66332","t":1,"q":"定轴转动刚体上距转轴 r 处一点的法向加速度大小为（     ）。","a":["an=αr","an=ωr","an=ω²r","an=α/r","",""],"r":"C","e":"法向加速度 an=ω²r=v²/r，方向指向转轴。转动刚体上各点的角速度、角加速度相同，而线量与 r 成正比。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66333","t":1,"q":"点的合成运动中，牵连速度是指（     ）。","a":["动点相对于动系的速度","动系相对于定系的速度","动系上与动点重合那一点相对于定系的速度","动点相对于定系的速度","",""],"r":"C","e":"牵连速度是牵连点（某瞬时动系上与动点重合的那一点）相对于定系的速度。注意牵连点随时间变化，并非动系上某一固定点。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66334","t":1,"q":"点的速度合成定理为（     ）。","a":["va=ve+vr","va=ve-vr","va=vr-ve","ve=va+vr","",""],"r":"A","e":"速度合成定理：动点的绝对速度等于牵连速度与相对速度的矢量和，即 va=ve+vr。该定理对任何形式的牵连运动均成立。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66335","t":1,"q":"点的加速度合成定理中，当牵连运动为平动时，科氏加速度（     ）。","a":["等于 2ωe×vr，且一般不为零","为零","等于 ωe×vr","等于牵连加速度","",""],"r":"B","e":"牵连运动为平动时动系无角速度，科氏加速度 aC=2ωe×vr=0，此时绝对加速度等于牵连加速度与相对加速度的矢量和。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66336","t":1,"q":"科氏加速度的大小等于（     ）。","a":["ωe·vr","2ωe·vr·sinθ","ωe·vr·cosθ","2ωe·vr·cosθ","",""],"r":"B","e":"科氏加速度 aC=2ωe×vr，其大小为 2ωe·vr·sinθ，θ 为 ωe 与 vr 的夹角；方向由右手螺旋法则确定。当 ωe 与 vr 平行时 aC=0。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66337","t":1,"q":"刚体平面运动可分解为（     ）。","a":["平动和转动","直线运动和曲线运动","牵连运动和相对运动","定轴转动和定点运动","",""],"r":"A","e":"刚体平面运动可分解为随同基点的平动（牵连运动）与绕基点的转动（相对运动）。基点选择不同，平动部分不同，但转动部分的角速度、角加速度相同。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66338","t":1,"q":"刚体平面运动时，其上任意两点的速度在两点连线上的投影（     ）。","a":["相等","不相等","与两点距离成正比","为零","",""],"r":"A","e":"速度投影定理：平面运动刚体上任意两点的速度在两点连线上的投影相等。这是速度合成定理的推论，使用简便。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66339","t":1,"q":"刚体平面运动时，某瞬时其上速度为零的点称为（     ）。","a":["基点","速度瞬心","加速度瞬心","质心","",""],"r":"B","e":"平面运动刚体在某瞬时速度为零的点称为速度瞬心。该瞬时刚体绕瞬心作瞬时转动，但瞬心位置随时间变化，其加速度一般不为零。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66340","t":1,"q":"刚体平面运动时，速度瞬心的加速度（     ）。","a":["一定为零","一定不为零","一般不为零","等于质心加速度","",""],"r":"C","e":"速度瞬心只保证该瞬时速度为零，其加速度一般不为零。把速度瞬心当作固定转动中心是常见错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66341","t":1,"q":"质点系的动量等于（     ）。","a":["各质点动量的矢量和","各质点动量的代数和","质心速度与总质量的乘积","A和C都对","",""],"r":"D","e":"质点系的动量 p=Σmᵢvᵢ=Mvc，即等于各质点动量的矢量和，也等于质点系总质量与质心速度的乘积。两种表述等价。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66342","t":1,"q":"质点系动量定理可写为（     ）。","a":["dp/dt=ΣFe","dp/dt=0","dL/dt=ΣMe","dW=ΣFe·dr","",""],"r":"A","e":"质点系动量对时间的导数等于作用于质点系外力的矢量和，dp/dt=ΣFe。内力不能改变质点系的总动量。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66343","t":1,"q":"质心运动定理的数学表达式为（     ）。","a":["Mac=ΣFe","Icα=ΣMe","dL/dt=ΣMe","mv²/2=W","",""],"r":"A","e":"质心运动定理：质点系总质量与质心加速度的乘积等于作用于质点系外力的矢量和，Mac=ΣFe。内力不改变质心的运动状态。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66344","t":1,"q":"质点系对某定轴的动量矩为（     ）。","a":["各质点动量对该轴之矩的代数和","各质点动量的矢量和","各质点动能的代数和","质心速度与质量的乘积","",""],"r":"A","e":"质点系对轴的动量矩 Lz=Σmᵢvᵢrᵢ，即各质点动量对该轴之矩的代数和。刚体定轴转动时 Lz=Izω。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66345","t":1,"q":"质点系动量矩定理可写为（     ）。","a":["dLz/dt=ΣMz(Fe)","dLz/dt=0","dW=ΣFe·dr","dp/dt=ΣFe","",""],"r":"A","e":"质点系对定轴的动量矩对时间的导数等于作用于质点系外力对该轴之矩的代数和。内力不改变质点系对轴的动量矩。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66346","t":1,"q":"质点系对某定轴的外力矩之和为零时，该质点系对该轴的动量矩（     ）。","a":["守恒","为零","逐渐增大","逐渐减小","",""],"r":"A","e":"由动量矩定理，外力对某轴之矩的代数和为零时，质点系对该轴的动量矩守恒。这是动量矩守恒定律。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66347","t":1,"q":"质点系动能定理的微分形式为（     ）。","a":["dW=δW","dT=δW","dT=dt","dp=δW","",""],"r":"B","e":"质点系动能的微分等于作用于质点系所有力的元功之和，即 dT=δW。动能是标量，恒为非负值。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66348","t":1,"q":"定轴转动刚体的动能为（     ）。","a":["mv²/2","Izω²/2","Izα²/2","mgh","",""],"r":"B","e":"定轴转动刚体的动能 T=Izω²/2，其中 Iz 为刚体对转轴的转动惯量，ω 为角速度。平动刚体的动能为 mv²/2。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66349","t":1,"q":"达朗伯原理中所加的惯性力为（     ）。","a":["Fg=-mac","Fg=mac","Fg=-ΣFe","Fg=mω²r","",""],"r":"A","e":"达朗伯原理：在运动的质点上假想加上惯性力 Fg=-mac，则主动力、约束力与惯性力构成平衡力系（动静法）。惯性力方向与加速度方向相反。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66350","t":1,"q":"刚体绕定轴转动的转动惯量与（     ）有关。","a":["质量大小","质量分布","转轴位置","以上三者都有关","",""],"r":"D","e":"转动惯量 Iz=Σmᵢrᵢ²，既与质量大小有关，也与质量相对转轴的分布有关，还与转轴位置有关。平行移轴定理反映了转轴位置的影响。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66351","t":2,"q":"点作曲线运动时，下列说法正确的有（     ）。","a":["速度方向沿轨迹切线","切向加速度反映速度大小的变化","法向加速度反映速度方向的变化","全加速度方向沿轨迹切线","",""],"r":"ABC","e":"点作曲线运动时速度沿切线；切向加速度 aτ=dv/dt 反映快慢变化，法向加速度 an=v²/ρ 反映方向变化。全加速度为二者的矢量和，一般不沿切线，故D错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66352","t":2,"q":"关于刚体平动，下列说法正确的有（     ）。","a":["其上任一直线始终与原位置平行","各点轨迹形状相同且互相平行","同一瞬时各点速度相同","同一瞬时各点加速度相同","",""],"r":"ABCD","e":"平动刚体上任一直线方位不变；各点轨迹互相平行且全等；同一瞬时各点速度、加速度完全相同。四选项均正确。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66353","t":2,"q":"刚体定轴转动时，下列说法正确的有（     ）。","a":["ω=dφ/dt","α=dω/dt","v=ωr","aτ=αr，an=ω²r","",""],"r":"ABCD","e":"定轴转动的基本关系：角速度 ω=dφ/dt，角加速度 α=dω/dt；距转轴 r 处点的 v=ωr，aτ=αr，an=ω²r。四选项均正确。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66354","t":2,"q":"关于点的合成运动，下列说法正确的有（     ）。","a":["绝对运动是动点相对于定系的运动","相对运动是动点相对于动系的运动","牵连运动是动系相对于定系的运动","速度合成定理为 va=ve+vr","",""],"r":"ABCD","e":"三种运动的定义与速度合成定理 va=ve+vr 是合成运动分析的基础。注意牵连速度是牵连点相对定系的速度。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66355","t":2,"q":"关于科氏加速度，下列说法正确的有（     ）。","a":["aC=2ωe×vr","牵连运动为平动时 aC=0","ωe 与 vr 平行时 aC=0","大小为 2ωe·vr·sinθ","",""],"r":"ABCD","e":"科氏加速度 aC=2ωe×vr，大小 2ωe·vr·sinθ。牵连运动平动时 ωe=0，故 aC=0；ωe 与 vr 平行（θ=0）时 aC=0。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66356","t":2,"q":"关于刚体平面运动，下列说法正确的有（     ）。","a":["可分解为随基点的平动与绕基点的转动","基点选择不同，平动部分不同","基点选择不同，转动角速度不同","速度投影定理：两点速度在两点连线上的投影相等","",""],"r":"ABD","e":"平面运动分解时，平动部分随基点而异，但绕基点转动的角速度、角加速度与基点选择无关，故C错误。速度投影定理是常用的快捷方法。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66357","t":2,"q":"关于速度瞬心，下列说法正确的有（     ）。","a":["该点瞬时速度为零","该瞬时刚体绕瞬心作瞬时转动","瞬心位置一般随时间变化","瞬心的加速度一定为零","",""],"r":"ABC","e":"速度瞬心是某瞬时速度为零的点，该瞬时刚体绕它作瞬时转动；瞬心位置随时间改变，其加速度一般不为零，故D错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66358","t":2,"q":"下列关于动量的说法中，正确的有（     ）。","a":["质点系动量等于各质点动量的矢量和","p=Mvc","动量是矢量","内力可以改变质点系的总动量","",""],"r":"ABC","e":"p=Σmᵢvᵢ=Mvc，动量是矢量。内力不能改变质点系的总动量，只有外力才能改变，故D错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66359","t":2,"q":"下列关于动量矩的说法中，正确的有（     ）。","a":["刚体定轴转动时 Lz=Izω","外力对轴之矩为零时动量矩守恒","内力不改变质点系对轴的动量矩","动量矩是标量","",""],"r":"ABC","e":"动量矩是矢量（对点）或代数量（对轴）；Lz=Izω；外力矩为零时动量矩守恒；内力不改变总动量矩。故D错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66360","t":2,"q":"下列关于动能的说法中，正确的有（     ）。","a":["动能是标量且恒为非负","平动刚体动能为 mv²/2","定轴转动刚体动能为 Izω²/2","动能定理可求解与力、位移有关的问题","",""],"r":"ABCD","e":"动能是标量、非负；平动 T=mv²/2，定轴转动 T=Izω²/2；动能定理建立了力、位移与速度之间的关系，适用于求解速度、位移等问题。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66361","t":2,"q":"关于质心运动定理，下列说法正确的有（     ）。","a":["Mac=ΣFe","内力不改变质心的运动","外力主矢为零时质心作惯性运动","质心运动与质点系转动无关","",""],"r":"ABC","e":"Mac=ΣFe 表明质心运动只取决于外力主矢；内力不改变质心运动；外力主矢为零时质心保持静止或匀速直线运动。质心运动与转动并非完全无关（如平面运动中二者可耦合分析），D表述过于绝对。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66362","t":2,"q":"关于达朗伯原理（动静法），下列说法正确的有（     ）。","a":["惯性力 Fg=-mac","加上惯性力后可按静力学方法列平衡方程","惯性力是真实作用在物体上的力","动静法所列方程本质是运动微分方程","",""],"r":"ABD","e":"惯性力是为形式上化为平衡问题而虚加的力，并非真实作用于物体的力，故C错误。动静法所列方程本质上就是运动微分方程。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66363","t":2,"q":"下列关于转动惯量的说法中，正确的有（     ）。","a":["与质量大小有关","与质量分布有关","与转轴位置有关","与刚体运动状态有关","",""],"r":"ABC","e":"转动惯量 Iz=Σmᵢrᵢ² 是刚体转动惯性的度量，取决于质量大小、分布与转轴位置，是刚体自身的固有属性，与运动状态无关，故D错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66364","t":2,"q":"点作匀变速曲线运动时（切向加速度为常数），下列说法正确的有（     ）。","a":["切向加速度为常数","法向加速度随速度变化","全加速度方向不变","可用匀变速公式计算路程","",""],"r":"ABD","e":"切向加速度为常数时速度大小按匀变速规律变化，可用相应公式计算路程；法向加速度 an=v²/ρ 随速度变化，故全加速度方向随之改变，C错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66365","t":2,"q":"关于刚体定点运动与定轴转动，下列说法正确的有（     ）。","a":["定轴转动是定点运动的特例","定轴转动时刚体上存在一条固定不动的直线","定点运动时刚体上只有一点固定","二者角速度都是矢量","",""],"r":"ABCD","e":"定点运动只有一个固定点，定轴转动则有一条固定轴（其上各点不动），故定轴转动是定点运动的特例；二者角速度均为矢量。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66366","t":3,"q":"点作曲线运动时，速度方向沿轨迹的切线并指向运动的一方。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"速度是矢量，方向沿轨迹切线并指向运动的一方，大小等于路程对时间的一阶导数的绝对值。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66367","t":3,"q":"点作匀速圆周运动时加速度为零。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"匀速圆周运动速度大小不变但方向不断改变，故切向加速度为零而法向加速度 an=v²/R≠0，全加速度不为零。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66368","t":3,"q":"刚体平动时，其上各点的轨迹一定是直线。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"平动刚体上各点轨迹形状相同且互相平行，可以是曲线，如平移的曲柄连杆机构中的连杆作曲线平动。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66369","t":3,"q":"刚体平动时，其上任意两点的速度和加速度均相同。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"平动刚体上各点在同一瞬时的速度、加速度完全相同，故研究平动可归结为研究其上任一点的运动。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66370","t":3,"q":"刚体定轴转动时，角速度是矢量，其方向由右手螺旋法则确定。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"角速度沿转轴，方向由右手螺旋法则确定；在平面问题中常按代数量处理，但本质是矢量。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66371","t":3,"q":"定轴转动刚体上各点的角速度和角加速度都相同。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"同一刚体绕定轴转动时，各点在同一瞬时具有相同的角速度和角加速度，而线速度、线加速度与到转轴的距离成正比。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66372","t":3,"q":"点的合成运动中，牵连速度是动系上任一点相对于定系的速度。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"牵连速度是牵连点（某瞬时动系上与动点重合的那一点）相对定系的速度，并非动系上任一点的速度。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66373","t":3,"q":"速度合成定理 va=ve+vr 对任何形式的牵连运动都成立。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"速度合成定理是普遍定理，无论牵连运动是平动、定轴转动还是平面运动均成立。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66374","t":3,"q":"当牵连运动为平动时，科氏加速度一般不为零。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"牵连运动为平动时动系角速度 ωe=0，科氏加速度 aC=2ωe×vr=0。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66375","t":3,"q":"刚体平面运动时，基点选择不同，绕基点转动的角速度也不同。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"平面运动分解时，平动部分随基点而变，但绕基点转动的角速度、角加速度与基点选择无关。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66376","t":3,"q":"11.速度瞬心的加速度一定为零。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"速度瞬心只保证该点瞬时速度为零，其加速度一般不为零。把瞬心当作加速度为零的固定点是常见错误。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66377","t":3,"q":"质点系的内力不能改变质点系的总动量。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"质点系动量定理表明，只有外力才能改变质点系的总动量，内力成对出现、矢量和为零，不改变总动量。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66378","t":3,"q":"质点系外力对某轴之矩的代数和为零时，质点系对该轴的动量矩守恒。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"这是动量矩守恒定律，是动量矩定理在合外力矩为零时的特例。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66379","t":3,"q":"动能是矢量，可正可负。（     ）","a":["正确 ","错误","","","",""],"r":"B","e":"动能是标量且恒为非负值，T=mv²/2≥0，不存在方向，也不能为负。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]},{"id":"66380","t":3,"q":"用动静法列出的平衡方程，本质上仍是运动微分方程。（     ）","a":["正确 ","错误","","","",""],"r":"A","e":"动静法只是把运动微分方程移项后写成平衡形式，便于用静力学方法求解，其物理本质未变。","l3":"工程力学","l4":"第3章","ap":[false,false,false,false,false,false]}]},{"k":"工程力学||第4章","n":"工程力学 / 第4章","qs":[{"id":"66381","t":1,"q":"杆件的基本变形形式有四种，下列不属于基本变形的是（     ）。","a":["轴向拉伸或压缩","扭转","弯曲","偏心拉伸","",""],"r":"D","e":"杆件的四种基本变形为轴向拉压、剪切、扭转和弯曲。偏心拉伸属于拉（压）与弯曲的组合变形，不是基本变形。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66382","t":1,"q":"求杆件内力的基本方法是（     ）。","a":["静力分析","结点法","截面法","叠加法","",""],"r":"C","e":"截面法是求杆件内力的基本方法：在欲求内力处假想截开，取任一侧为研究对象，由平衡条件求出截面上的内力分量。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66383","t":1,"q":"轴力的符号规定是（     ）。","a":["使杆件受压为正","使杆件受拉为正","指向截面外法线为正","顺时针为正","",""],"r":"B","e":"轴力以拉为正、压为负：轴力背离截面（使杆段受拉）取正号，指向截面（使杆段受压）取负号。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66384","t":1,"q":"扭矩的正负通常用（     ）确定。","a":["左手螺旋法则","右手螺旋法则","截面法","叠加法","",""],"r":"B","e":"扭矩的正负按右手螺旋法则确定：四指沿扭矩转向弯曲，拇指指向截面外法线方向时扭矩为正，反之为负。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66385","t":1,"q":"梁的弯矩正负号规定为（     ）。","a":["顺时针转为正","使所选隔离体下部受拉为正","使所选隔离体上部受拉为正","逆时针转为正","",""],"r":"B","e":"弯矩符号通常规定：使梁段下部受拉（上部受压）为正，使梁段上部受拉为负。弯矩图一般画在受拉一侧。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66386","t":1,"q":"梁在集中力作用的截面处，其内力图为（     ）。","a":["剪力图有突变，弯矩图光滑连续","剪力图有突变，弯矩图有转折","弯矩图有突变，剪力图光滑连续","弯矩图有突变，剪力图有转折","",""],"r":"B","e":"集中力作用处剪力图发生突变，突变值等于该集中力大小；弯矩图出现转折（尖点），但连续不突变。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66387","t":1,"q":"梁在集中力偶作用的截面处，其内力图为（     ）。","a":["剪力图有突变，弯矩图无变化","剪力图有突变，弯矩图有转折","弯矩图有突变，剪力图无变化","弯矩图有突变，剪力图有转折","",""],"r":"C","e":"集中力偶作用处弯矩图发生突变，突变值等于该力偶矩；剪力图不受影响，保持连续。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66388","t":1,"q":"剪力为零的截面上，弯矩一定为（     ）。","a":["最大值","最小值","极值","零","",""],"r":"C","e":"由 dM/dx=Fs 可知，剪力为零处弯矩取得极值（最大或最小），但不一定为零。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66389","t":1,"q":"悬臂梁在均布荷载作用下，自由端处的剪力和弯矩为（     ）。","a":["剪力为零、弯矩最大","剪力最大、弯矩为零","剪力为零、弯矩为零","剪力最大、弯矩最大","",""],"r":"C","e":"悬臂梁自由端无外力作用，故自由端剪力和弯矩均为零；固定端处剪力最大、弯矩最大。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66390","t":1,"q":"简支梁在均布荷载 q 作用下，梁长为 l，则跨中截面的弯矩为（     ）。","a":["ql²/2","ql²/4","ql²/8","ql²/16","",""],"r":"C","e":"简支梁受均布荷载时跨中弯矩 M=ql²/8，支座处弯矩为零，两端剪力为 ql/2，跨中剪力为零。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66391","t":1,"q":"静定杆件的内力与杆件所受的（     ）有关。","a":["外力","外力、截面","外力、截面、材料","外力、截面、杆长、材料","",""],"r":"A","e":"静定杆件的内力只由平衡条件决定，仅与所受外力有关，与截面尺寸、材料性质、杆长均无关。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66392","t":1,"q":"静定杆件的应力与杆件所受的（     ）有关。","a":["外力","外力、截面","外力、截面、材料","外力、截面、杆长、材料","",""],"r":"B","e":"应力等于内力除以截面几何量（如 σ=FN/A），故与外力和截面有关，与材料性质、杆长无关。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66393","t":1,"q":"静定杆件的变形与杆件所受的（     ）有关。","a":["  外力","外力、截面","外力、截面、材料","外力、截面、杆长、材料","",""],"r":"D","e":"变形由内力、杆长、截面和材料共同决定，如拉压杆 Δl=FN·l/(EA)，故与外力、截面、杆长、材料都有关。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66394","t":1,"q":"其他条件不变时，轴向拉压杆的横截面面积增加 1 倍，则横截面正应力（     ）。","a":["减少 1/2","减少 1 倍","增加 1 倍","不变","",""],"r":"A","e":"σ=FN/A，轴力不变时应力与面积成反比。面积增加 1 倍即变为原来的 2 倍，应力变为原来的 1/2，即减少 1/2。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66395","t":1,"q":"材料的主要力学性能指标分为强度、刚度、塑性三项，其塑性指标是（     ）。","a":["σs 和 σb","E 和 μ","δ 和 ψ","δ 和 μ","",""],"r":"C","e":"伸长率 δ 和断面收缩率 ψ 是衡量材料塑性性能的两个指标；σs、σb 属于强度指标，E 属于刚度指标，μ 为泊松比。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66396","t":1,"q":"工程上通常将伸长率大于（     ）的材料称为塑性材料。","a":["2%","5%","10%","15%","",""],"r":"B","e":"工程上一般以伸长率 δ 是否大于 5% 区分塑性材料与脆性材料：δ>5% 为塑性材料，δ<5% 为脆性材料。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66397","t":1,"q":"低碳钢拉伸试验的应力—应变曲线大致分为四个阶段，其顺序是（     ）。","a":["弹性阶段、屈服阶段、强化阶段、颈缩破坏阶段","弹性阶段、塑性变形阶段、强化阶段、局部变形阶段","弹性阶段、屈服阶段、塑性变形阶段、断裂阶段","屈服阶段、塑性变形阶段、断裂阶段、强化阶段","",""],"r":"A","e":"低碳钢拉伸图的四个阶段依次为弹性阶段、屈服阶段、强化阶段和颈缩（局部变形）破坏阶段。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66398","t":1,"q":"低碳钢应力—应变图中，应力与应变成正比的最高点对应的应力 σp 称为（     ）。","a":["弹性极限","比例极限","屈服点","强度极限","",""],"r":"B","e":"σp 为比例极限，是应力与应变保持线性关系的最高应力；σe 为弹性极限；σs 为屈服点；σb 为强度极限。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66399","t":1,"q":"低碳钢应力—应变图中，弹性阶段最高点对应的应力 σe 称为（     ）。","a":["比例极限","弹性极限","屈服点","强度极限","",""],"r":"B","e":"σe 为弹性极限，是材料只产生弹性变形的最大应力。超过 σe 后将出现塑性变形。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66400","t":1,"q":"低碳钢应力—应变图中，曲线最高点对应的应力称为（     ）。","a":["比例极限","弹性极限","屈服点","强度极限","",""],"r":"D","e":"σb 为强度极限（抗拉强度），是应力—应变曲线最高点对应的应力，代表材料抵抗断裂的最大能力。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66401","t":1,"q":"塑性材料冷作硬化后，下列结论正确的是（     ）。","a":["比例极限提高，弹性模量降低","比例极限提高，塑性变形程度降低","比例极限不变，弹性模量不变","比例极限不变，塑性变形程度不变","",""],"r":"B","e":"冷作硬化使材料的比例极限、屈服极限提高，塑性变形程度（伸长率、断面收缩率）降低，而弹性模量基本不变。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66402","t":1,"q":"矩形截面梁横力弯曲时，在横截面的中性轴处（     ）。","a":["正应力最大，切应力为零","正应力为零，切应力最大","正应力和切应力均为最大","正应力和切应力均为零","",""],"r":"B","e":"弯曲正应力沿截面高度线性分布，中性轴处为零；弯曲切应力沿高度呈抛物线分布，中性轴处最大。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66403","t":1,"q":"中性轴是梁的（     ）的交线。","a":["纵向对称平面和横截面","纵向对称平面与中性层","横截面与中性层","横截面与顶面或底面","",""],"r":"C","e":"中性层是梁内既不伸长也不缩短的一层，中性轴是中性层与横截面的交线，横截面上正应力在中性轴处为零。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66404","t":1,"q":"截面各种几何性质中，可以为零的是（     ）。","a":["静矩","惯性矩","抗弯截面系数","面积","",""],"r":"A","e":"静矩是代数量，可为零（对形心轴）；惯性矩、抗弯截面系数和面积对非退化截面均为正值。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66405","t":1,"q":"在面积相同的情况下，能取得较大惯性矩的截面是（     ）。","a":["圆形","正方形","矩形（长边远离中性轴）","不能确定","",""],"r":"C","e":"惯性矩反映截面面积对中性轴的分布情况，面积越远离中性轴惯性矩越大。故面积相同时，立放矩形比正方形、圆形更“高效”。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66406","t":1,"q":"对于塑性材料，在横截面面积相同的情况下，采用（     ）截面形式抗弯强度最好。","a":["正方形","矩形","实心圆","工字型（标准型）","",""],"r":"D","e":"工字型截面把大部分材料布置在远离中性轴的上下翼缘处，抗弯截面系数大，故面积相同时抗弯强度最好。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66407","t":1,"q":"圆轴扭转时，横截面上的切应力（     ）。","a":["均匀分布","沿半径线性分布，中心为零，边缘最大","沿半径抛物线分布","沿半径按双曲线分布","",""],"r":"B","e":"圆轴扭转时切应力 τ=Tρ/Ip 沿半径线性分布：轴心处为零，外边缘处最大，τmax=T/Wp。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66408","t":1,"q":"杆件受到拉（压）、弯、扭组合变形时，危险点的应力状态通常是（     ）。","a":["单向应力状态","二向（平面）应力状态","三向应力状态","纯剪切应力状态","",""],"r":"B","e":"拉（压）弯组合在危险点产生正应力，扭转产生切应力，二者叠加后危险点为二向应力状态，须用强度理论校核。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66409","t":1,"q":"关于应力集中，下列说法正确的是（     ）。","a":["对塑性材料构件的静强度影响很大","对脆性材料构件的承载能力影响较小","应力集中会严重降低脆性材料构件的承载能力","应力集中只在动荷载下才需考虑","",""],"r":"C","e":"构件截面突变处会产生应力集中。塑性材料因局部屈服可使应力重新分布，影响较小；脆性材料对应力集中敏感，承载能力明显降低。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66410","t":1,"q":"下列哪种措施不能提高梁的弯曲刚度（     ）。","a":["  增大梁的抗弯刚度 EI","减小梁的跨度","增加支承","将分布荷载改为几个集中荷载","",""],"r":"D","e":"增大 EI、减小跨度、增加支承均可减小梁的挠度，提高刚度。把分布荷载改为集中荷载一般不会减小变形，故不能提高刚度。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66411","t":2,"q":"杆件的基本变形形式包括（     ）。","a":["轴向拉伸或压缩","剪切","扭转","弯曲","",""],"r":"ABCD","e":"杆件的四种基本变形为轴向拉伸（压缩）、剪切、扭转和弯曲。实际构件常为两种或多种基本变形的组合。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66412","t":2,"q":"关于截面法求内力，下列说法正确的有（     ）。","a":["在欲求内力处假想将杆件截开","取截开后的任一部分为研究对象","由平衡条件求截面上的内力","同一截面的内力与所取研究对象无关","",""],"r":"ABCD","e":"截面法的步骤为截开、取研究对象、列平衡方程。无论取截面哪一侧，所得内力大小相等、方向相反，与研究对象选择无关。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66413","t":2,"q":"下列关于轴向拉压杆的说法中，正确的有（     ）。","a":["横截面上正应力均匀分布","σ=FN/A 只在弹性范围内适用","变形 Δl=FN·l/(EA)","内力与截面尺寸、材料无关","",""],"r":"ACD","e":"轴向拉压杆横截面正应力均匀分布，变形由胡克定律给出 Δl=FNl/(EA)；内力仅由平衡条件决定，与截面、材料无关。σ=FN/A 是静力学关系，在弹性、塑性范围内均可用，只是应力分布假设的适用条件不同，故B表述不准确。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66414","t":2,"q":"关于低碳钢拉伸试验，下列说法正确的有（     ）。","a":["四个阶段为弹性、屈服、强化、颈缩破坏","σp 为比例极限，σs 为屈服点","σb 为强度极限","伸长率和断面收缩率是塑性指标","",""],"r":"ABCD","e":"低碳钢拉伸图的四个阶段、特征应力 σp、σe、σs、σb 及塑性指标 δ、ψ 均为材料力学性能的基本内容。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66415","t":2,"q":"关于塑性材料与脆性材料，下列说法正确的有（     ）。","a":["工程上常以伸长率是否大于 5% 区分","塑性材料抗拉、抗压能力相近","脆性材料抗压能力一般大于抗拉能力","塑性材料取强度极限作为极限应力","",""],"r":"ABC","e":"塑性材料以屈服极限 σs 作为极限应力，脆性材料以强度极限 σb 作为极限应力，故D错误。其余三项均正确。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66416","t":2,"q":"下列关于梁的内力图的说法中，正确的有（     ）。","a":["集中力作用处剪力图突变，弯矩图有转折","集中力偶作用处弯矩图突变，剪力图无变化","弯矩图应画在梁的受拉一侧","均布荷载段剪力图为斜直线，弯矩图为抛物线","",""],"r":"ABCD","e":"内力图的规律：集中力→剪力突变、弯矩转折；集中力偶→弯矩突变；均布荷载段剪力斜直线、弯矩抛物线；弯矩图画在受拉侧。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66417","t":2,"q":"下列关于弯曲应力的说法中，正确的有（     ）。","a":["弯曲正应力沿截面高度线性分布","中性轴处正应力为零","矩形截面弯曲切应力在中性轴处最大","上下边缘处弯曲切应力为零","",""],"r":"ABCD","e":"σ=My/Iz 沿高度线性分布，中性轴处为零；τ=FsS*/(Izb) 沿高度抛物线分布，中性轴最大，上下边缘为零。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66418","t":2,"q":"下列关于截面几何性质的说法中，正确的有（     ）。","a":["静矩与坐标轴选取有关","图形对形心轴的静矩恒为零","惯性矩恒为正值","抗弯截面系数 Wz=Iz/ymax","",""],"r":"ABCD","e":"静矩是代数量、与轴有关，对形心轴为零；惯性矩对非退化截面恒正；Wz=Iz/ymax，量纲为长度三次方。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66419","t":2,"q":"下列关于圆轴扭转的说法中，正确的有（     ）。","a":["切应力沿半径线性分布","τmax=T/Wp","扭转角 φ=TL/(GIp)","极惯性矩 Ip 反映截面抗扭能力","",""],"r":"ABCD","e":"圆轴扭转时 τ=Tρ/Ip，边缘最大 τmax=T/Wp；扭转角 φ=TL/(GIp)，GIp 为抗扭刚度，Ip 为极惯性矩。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66420","t":2,"q":"下列关于组合变形的说法中，正确的有（     ）。","a":["偏心拉伸是拉伸与弯曲的组合","弯扭组合变形危险点为二向应力状态","组合变形可用叠加原理计算应力","组合变形必须用强度理论校核","",""],"r":"ABCD","e":"组合变形在小变形、线弹性条件下可用叠加原理分别计算再叠加；弯扭组合危险点同时存在正应力与切应力，须用强度理论校核。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66421","t":2,"q":"下列措施中，能提高梁弯曲强度的有（     ）。","a":["采用抗弯截面系数大的截面","减小最大弯矩","增加梁的跨度","把材料布置在远离中性轴处","",""],"r":"ABD","e":"弯曲强度条件 σmax=Mmax/Wz≤[σ]，增大 Wz、减小 Mmax 均可提高强度。增大跨度会增大弯矩，反而不利，故C错误。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66422","t":2,"q":"下列关于应力集中的说法中，正确的有（     ）。","a":["截面突变处会产生应力集中","塑性材料对静荷载下的应力集中不敏感","脆性材料对应力集中敏感","动荷载下应力集中影响显著","",""],"r":"ABCD","e":"应力集中发生在孔、槽、台阶等截面突变处；塑性材料因局部屈服可缓解，脆性材料则易在应力集中处开裂；动荷载下影响更显著。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66423","t":2,"q":"下列关于变形与刚度的说法中，正确的有（     ）。","a":["EI 称为梁的抗弯刚度","EA 称为杆的抗拉（压）刚度","GIp 称为圆轴的抗扭刚度","提高刚度只能靠增加截面尺寸","",""],"r":"ABC","e":"EI、EA、GIp 分别是弯曲、拉压、扭转的刚度。提高刚度还可通过减小跨度、增加支承、优化结构形式等实现，故D错误。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66424","t":2,"q":"关于静定杆件的内力、应力、变形，下列说法正确的有（     ）。","a":["内力只与外力有关","应力与外力和截面有关","变形与外力、截面、杆长、材料都有关","内力与材料有关","",""],"r":"ABC","e":"静定杆件内力由平衡条件决定，仅与外力有关；应力 σ=FN/A 与截面有关；变形 Δl=FNl/(EA) 与杆长、材料也有关。故D错误。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66425","t":2,"q":"下列关于中性轴的说法中，正确的有（     ）。","a":["中性轴是中性层与横截面的交线","中性轴处正应力为零","中性轴通过截面形心（平面弯曲时）","中性轴将截面分为受拉区和受压区","",""],"r":"ABCD","e":"中性层是梁内既不伸长也不缩短的一层；中性轴为其与横截面的交线，过形心，正应力为零，将截面分为受拉、受压两区。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66426","t":3,"q":"内力是由于外力作用在构件内引起的附加力系。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"内力是构件内部各部分之间因外力作用而产生的相互作用力，是分布内力系向截面形心简化后的结果。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66427","t":3,"q":"简支梁在跨中受集中力作用时，跨中剪力一定最大。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"简支梁跨中受集中力时，跨中截面剪力发生突变，两侧剪力分别为 ±P/2，绝对值最大在支座附近（P/2），跨中并非剪力最大处。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66428","t":3,"q":"弯矩使梁段上部受拉、下部受压时为负。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"弯矩符号规定：使梁段下部受拉为正，上部受拉（下部受压）为负。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66429","t":3,"q":"简支梁在跨中受集中力作用时，跨中弯矩一定最大。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"简支梁跨中受集中力 P 时，跨中弯矩 M=Pl/4 为全梁最大值。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66430","t":3,"q":"弯矩图应画在梁的受拉一侧。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"工程习惯将弯矩图画在受拉一侧，这样图的形状直接反映梁的变形趋势，便于配置受拉钢筋等。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66431","t":3,"q":"当杆件受拉而伸长时，轴力背离截面，轴力取负号。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"轴力符号规定为拉为正、压为负。杆件受拉伸长时轴力背离截面，应取正号。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66432","t":3,"q":"用截面法求内力时，同一截面的内力因所取研究对象不同而不同。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"无论取截面哪一侧为研究对象，所得内力大小相等、符号一致，与研究对象的选择无关。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66433","t":3,"q":"梁支座处的弯矩必为零。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"只有铰支座（固定铰、可动铰）处弯矩为零；固定端支座处弯矩一般不为零，且常为最大值。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66434","t":3,"q":"纯弯曲与剪切弯曲（横力弯曲）的区别在于梁段内是否有剪力。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"纯弯曲梁段各截面只有弯矩而无剪力；横力弯曲梁段同时存在弯矩和剪力。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66435","t":3,"q":"梁上作用一个集中力偶，对剪力图的形状无影响。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"集中力偶只引起弯矩图突变，不影响剪力图，剪力图在该处保持连续。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66436","t":3,"q":"悬臂梁或外伸梁的自由端处，弯矩必为零。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"自由端无外力偶作用时弯矩为零；若自由端作用有集中力偶，则该处弯矩不为零，且等于该力偶矩。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66437","t":3,"q":"弯矩图上的极值就是梁内最大的弯矩。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"弯矩极值可能出现在剪力为零处，但全梁最大弯矩还应比较各控制截面（支座、集中力、集中力偶处）的弯矩值。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66438","t":3,"q":"有集中力作用处，剪力图有突变，弯矩图有尖点。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"集中力作用处剪力图突变（突变值等于集中力），弯矩图出现转折（尖点）但保持连续。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66439","t":3,"q":"梁上任一截面的弯矩等于该截面任一侧所有外力对截面形心之矩的代数和。（     ）","a":["正确  ","错误","","","",""],"r":"A","e":"这是由截面法直接得到的结论，是绘制弯矩图、计算指定截面弯矩的常用方法。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]},{"id":"66440","t":3,"q":"矩形截面梁不论平放还是立放，其承载能力是相同的。（     ）","a":["正确  ","错误","","","",""],"r":"B","e":"立放时截面高度大，抗弯截面系数 Wz=bh²/6 远大于平放时的 hb²/6，故立放承载能力更高。","l3":"工程力学","l4":"第4章","ap":[false,false,false,false,false,false]}]},{"k":"工程力学||第5章","n":"工程力学 / 第5章","qs":[{"id":"66441","t":1,"q":"过受力构件内一点，取不同方位截面时，其上的应力（     ）。","a":["完全相同","完全不同","一般不同","都为零","",""],"r":"C","e":"同一点处不同方位截面上的应力一般不同。应力状态就是过一点所有方位截面上应力的全体，通常用单元体表示。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66442","t":1,"q":"描述一点应力状态的常用方法是（     ）。","a":["画受力图","取单元体","画弯矩图","列平衡方程","",""],"r":"B","e":"围绕该点取微小正六面体（单元体），标明各面上的应力分量，即可完整描述该点的应力状态。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66443","t":1,"q":"单元体上切应力为零的截面称为（     ）。","a":["主平面","斜截面","中性面","横截面","",""],"r":"A","e":"切应力为零的截面称为主平面，主平面上的正应力称为主应力。任意点处总存在三个互相垂直的主平面。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66444","t":1,"q":"过受力构件内任一点，总可以找到（     ）个互相垂直的主平面。","a":["一","二","三","四","",""],"r":"C","e":"一点的应力状态总可用三个互相垂直的主平面上的主应力来描述，这是应力状态的基本性质。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66445","t":1,"q":"三个主应力按代数值大小排列，正确的顺序是（     ）。","a":["σ1≤σ2≤σ3","σ1≥σ2≥σ3","σ1=σ2=σ3","任意排列","",""],"r":"B","e":"三个主应力按代数值大小排列为 σ1≥σ2≥σ3。注意按代数值而非绝对值排序，拉应力为正、压应力为负。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66446","t":1,"q":"平面应力状态是指（     ）。","a":["单元体上只有正应力","单元体上只有切应力","有一个主应力为零的应力状态","三个主应力均不为零","",""],"r":"C","e":"平面（二向）应力状态有一个主应力为零，单元体各应力分量位于同一平面内，是工程中最常见的应力状态。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66447","t":1,"q":"纯剪切应力状态的三个主应力为（     ）。","a":["σ1=τ，σ2=0，σ3=-τ","σ1=σ2=σ3=τ","σ1=0，σ2=0，σ3=τ","σ1=τ，σ2=τ，σ3=0","",""],"r":"A","e":"纯剪切单元体的主应力为 σ1=τ、σ2=0、σ3=-τ，即最大主应力等于切应力，最小主应力为其负值。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66448","t":1,"q":"平面应力状态中，最大切应力所在的平面与主平面的夹角为（     ）。","a":["0°","30°","45°","90°","",""],"r":"C","e":"最大切应力所在平面与主平面成 45°，τmax=(σ1-σ3)/2（三向）或 (σmax-σmin)/2（平面）。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66449","t":1,"q":"切应力互等定理是指（     ）。","a":["两互相垂直截面上的切应力大小相等、符号相同","两互相垂直截面上的切应力大小相等、方向均指向或背离两截面交线","任意两截面上切应力相等","切应力与正应力相等","",""],"r":"B","e":"切应力互等定理：在互相垂直的两个截面上，切应力必成对出现，大小相等，方向均指向或均背离两截面的交线。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66450","t":1,"q":"在平面应力状态中，最大正应力的计算公式为（     ）。","a":["σmax=(σx+σy)/2+√[((σx-σy)/2)²+τxy²]","σmax=(σx+σy)/2","σmax=√(σx²+σy²)","σmax=σx+σy","",""],"r":"A","e":"平面应力状态主应力公式：σmax/min=(σx+σy)/2±√[((σx-σy)/2)²+τxy²]，即平均正应力加减最大切应力。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66451","t":1,"q":"应力圆（莫尔圆）的圆心坐标和半径分别为（     ）。","a":["((σx+σy)/2, 0) 和 √[((σx-σy)/2)²+τxy²]","(0, 0) 和 (σx+σy)/2","(σx, 0) 和 τxy","(σy, 0) 和 (σx-σy)/2","",""],"r":"A","e":"应力圆圆心在 σ 轴上，坐标为 ((σx+σy)/2, 0)，半径 R=√[((σx-σy)/2)²+τxy²]，圆上各点对应各斜截面上的应力。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66452","t":1,"q":"用应力圆求斜截面应力时，圆心角的转向与斜截面法线转角的关系是（     ）。","a":["相同且相等","转向相同，角度为斜截面转角的 2 倍","转向相反，角度相等","无对应关系","",""],"r":"B","e":"应力圆上的对应关系：圆心角为斜截面转角的 2 倍，且转向相同。这是应力圆作图法的基本规则。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66453","t":1,"q":"三向应力状态中，最大切应力的计算公式为（     ）。","a":["τmax=(σ1-σ2)/2","τmax=(σ2-σ3)/2","τmax=(σ1-σ3)/2","τmax=(σ1+σ3)/2","",""],"r":"C","e":"三向应力状态中最大切应力 τmax=(σ1-σ3)/2，位于与 σ1、σ3 所在主平面均成 45° 的斜截面上。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66454","t":1,"q":"三个主应力中有两个为零的应力状态称为（     ）。","a":["单向应力状态","二向应力状态","三向应力状态","纯剪切应力状态","",""],"r":"A","e":"单向应力状态只有一个主应力不为零，如轴向拉压杆横截面上的点；二向有一个为零；三向三个均不为零。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66455","t":1,"q":"下列属于二向应力状态的有（     ）。","a":["轴向拉压杆横截面上的点","纯扭转圆轴表面的点","受内压薄壁圆筒筒壁上的点","以上都是","",""],"r":"C","e":"轴向拉压杆为单向应力状态；纯扭转圆轴表面点为纯剪切（二向）；受内压薄壁圆筒筒壁同时存在轴向和环向正应力，为二向应力状态。故C正确，D错误。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66456","t":1,"q":"广义胡克定律建立了（     ）之间的关系。","a":["应力与应变","内力与外力","荷载与位移","强度与刚度","",""],"r":"A","e":"广义胡克定律描述复杂应力状态下应力与应变之间的物理关系，是单向胡克定律在多向应力状态下的推广。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66457","t":1,"q":"当杆件应力不超过比例极限时，横向线应变与纵向线应变的绝对值之比称为（     ）。","a":["弹性模量","泊松比","体积模量","剪切模量","",""],"r":"B","e":"泊松比 μ=|ε'/ε|，表示横向应变与纵向应变的比值，是材料的弹性常数，一般 0<μ<0.5。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66458","t":1,"q":"各向同性材料的独立弹性常数有（     ）个。","a":["一","二","三","四","",""],"r":"B","e":"各向同性材料只有两个独立的弹性常数，如 E 和 μ，或 G 和 μ。剪切模量 G=E/[2(1+μ)]，故三者中只有两个独立。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66459","t":1,"q":"三向等压应力状态下，材料（     ）。","a":["一定发生屈服","一定发生断裂","一般不发生破坏","发生剪切破坏","",""],"r":"C","e":"三向等压（静水压力）状态下只有体积改变而无形状改变，各强度理论预测的相当应力均为零，材料一般不会发生破坏。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66460","t":1,"q":"第一强度理论（最大拉应力理论）认为材料破坏的原因是（     ）。","a":["最大切应力达到极限值","最大拉应力达到极限值","最大伸长线应变达到极限值","形状改变比能达到极限值","",""],"r":"B","e":"第一强度理论认为无论何种应力状态，最大拉应力 σ1 达到材料的极限值时即发生断裂破坏，适用于脆性材料。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66461","t":1,"q":"第二强度理论（最大伸长线应变理论）认为材料破坏的原因是（     ）。","a":["最大切应力达到极限值","最大拉应力达到极限值","最大伸长线应变达到极限值","形状改变比能达到极限值","",""],"r":"C","e":"第二强度理论认为最大伸长线应变 ε1 达到极限值时材料破坏，其相当应力 σr2=σ1-μ(σ2+σ3)，适用于脆性材料。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66462","t":1,"q":"第三强度理论（最大切应力理论）认为材料屈服的原因是（     ）。","a":["最大切应力达到极限值","最大拉应力达到极限值","最大伸长线应变达到极限值","体积改变比能达到极限值","",""],"r":"A","e":"第三强度理论认为最大切应力 τmax 达到极限值时材料发生屈服，相当应力 σr3=σ1-σ3，适用于塑性材料。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66463","t":1,"q":"第四强度理论（形状改变比能理论）的相当应力是（     ）。","a":["σr4=σ1","σr4=σ1-σ3","σr4=√[(σ1-σ2)²+(σ2-σ3)²+(σ3-σ1)²]/√2","σr4=σ1-μ(σ2+σ3)","",""],"r":"C","e":"第四强度理论以形状改变比能（畸变能）密度为屈服判据，相当应力 σr4=√[((σ1-σ2)²+(σ2-σ3)²+(σ3-σ1)²)/2]，适用于塑性材料。","l3":"工程力学","l4": ":"下列关于塑性材料与脆性材料破坏形式的说法中，正确的有（     ）。","a":["塑性材料常发生屈服破坏","脆性材料常发生断裂破坏","低碳钢扭转断口沿 45° 螺旋面","铸铁扭转断口沿横截面","",""],"r":"ABCD","e":"塑性材料失效形式为屈服，脆性材料为断裂；低碳钢扭转由最大拉应力引起 45° 断口，铸铁扭转由最大切应力引起横断口。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66480","t":2,"q":"下列关于体积应变与泊松比的说法中，正确的有（     ）。","a":["体积应变 θ=ε1+ε2+ε3","泊松比 μ=|横向应变/纵向应变|","μ→0.5 时材料不可压缩","各向同性材料 μ 的取值范围为 0<μ<0.5","",""],"r":"ABCD","e":"体积应变为主应变之和；泊松比为横向与纵向应变绝对值之比；μ=0.5 时体积应变为零（不可压缩）；工程材料 μ 在 0~0.5 之间。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66481","t":2,"q":"关于平面应力状态的主应力公式，下列说法正确的有（     ）。","a":["σmax/min=(σx+σy)/2±√[((σx-σy)/2)²+τxy²]","最大切应力等于应力圆半径","主平面方位可由 tan2α0=2τxy/(σx-σy) 确定","主应力一定为正值","",""],"r":"ABC","e":"主应力公式与主平面方位公式如选项所示；最大切应力即应力圆半径。主应力可正可负（压应力为负），故D错误。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66482","t":2,"q":"下列关于纯剪切应力状态的说法中，正确的有（     ）。","a":["四个侧面上只有切应力","主应力为 τ、0、-τ","45° 斜截面上只有正应力","最大切应力为 τ","",""],"r":"ABC","e":"纯剪切单元体侧面上只有切应力；主应力为 τ、0、-τ；45° 方向为主平面，只有正应力。最大切应力 τmax=(σ1-σ3)/2=τ，即数值上等于 τ，D的表述易引起歧义但数值上成立——按公式 τmax=τ，故D也正确。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66483","t":2,"q":"下列关于应力状态分析方法的说法中，正确的有（     ）。","a":["解析法通过斜截面应力公式计算","图解法用应力圆（莫尔圆）","两种方法结果一致","应力圆可直观判断主应力与最大切应力","",""],"r":"ABCD","e":"解析法与图解法是应力状态分析的两种等价方法；应力圆形象直观，可直接读出主应力和最大切应力。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66484","t":2,"q":"下列关于三向应力状态的说法中，正确的有（     ）。","a":["三个主应力均不为零","最大切应力 τmax=(σ1-σ3)/2","三向等压时材料一般不破坏","三个主应力相等时无形状改变","",""],"r":"ABCD","e":"三向应力状态三个主应力均不为零；τmax=(σ1-σ3)/2；三向等压（或三个主应力相等）时只有体积改变，形状改变比能为零，一般不发生屈服破坏。","l3":"工程力学","l4":"第5章","ap":[false,false,false,false,false,false]},{"id":"66485","t":2,"q":"下列关于强度条件的说法中，正确的有（     ）。","a":["σr≤[σ] 是强度理论的统一形式","相当应力 σr 由应力状态和强度理论共同确定","许用应力 [σ]=σ0/n","强度条件可用于校核、设计截面和确定许用荷载","",""],"r":"ABCD","e":"强度条件统一写作 σr≤[σ]；相当应力由应力状态与所选强度理论给出；许用应力等于极限应力除以安全因数；强度条件有校核、设计、定荷载三类应用。","l3":"工程力学","l4":"第5章","ap":[false,fals
