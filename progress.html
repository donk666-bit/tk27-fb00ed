function read(key){ try { return JSON.parse(localStorage.getItem(key)) || null } catch(e){ return null } }
function pct(x,y){ return y ? Math.round(x*100/y) : 0 }
function row(name, url, done, total, right, wrongN, extra){
  const p = pct(done,total);
  return '<tr><td><a href="'+url+'" style="color:#1d2129;text-decoration:none">'+name+'</a></td>'
    + '<td>'+done+' / '+total+'</td>'
    + '<td><div class="bar"><i style="width:'+p+'%"></i></div></td>'
    + '<td>'+(right==null?'—':pct(right, done))+'%</td>'
    + '<td>'+wrongN+'</td><td>'+extra+'</td></tr>';
}

  const ans = st.answers || {};
  const akeys = AKEYS[it.key] || {};
  const done = Object.keys(ans).filter(function(k){ return ans[k] && ans[k].length; }).length;
  let right = 0, wrongCalc = 0;
  Object.keys(ans).forEach(function(k){
    const v = ans[k]; const exp = akeys[k];
    if (!v || !v.length || !exp) return;
    const a = v.slice().sort().join(''), b = exp.split('').sort().join('');
    if (a === b) right++; else wrongCalc++;
  });
  const wrong = st.wrongSet ? Object.keys(st.wrongSet).length : wrongCalc;
  const state = st.submitted ? '已交卷' : ((done || st.running) ? '进行中' : '未开始');
  rowsP += row(it.name, it.url, done, it.total, right, wrong, state);
});
let html = '';
html += '<h2>题库</h2>' + (rowsB ? '<table class="tbl"><tr><th>题库</th><th>已做</th><th>进度</th><th>正确率</th><th>错题</th><th>收藏</th></tr>'+rowsB+'</table>' : '<div class="empty">还没有做过题库里的题。</div>');
html += '<h2>模拟卷</h2>' + (rowsP ? '<table class="tbl"><tr><th>试卷</th><th>已答</th><th>进度</th><th>正确率</th><th>错题</th><th>状态</th></tr>'+rowsP+'</table>' : '<div class="empty">还没有做过模拟卷。</div>');
document.getElementById('app').innerHTML = html;
</script></body></html>
